			shellPath = /bin/sh;
			shellScript = "#!/bin/bash\n\n  set -e\n\n  ENV_FILE=\"$SRCROOT/.env\"\n  OUTPUT_FILE=\"$SRCROOT/Mercury/Generated/Secrets.swift\"\n\n  echo \"=== Generate Secrets Script ===\"\n  echo \"SRCROOT: $SRCROOT\"\n  echo \"ENV_FILE: $ENV_FILE\"\n  echo \"OUTPUT_FILE: $OUTPUT_FILE\"\n\n  # Create Generated directory if it doesn't exist\n  echo \"Creating directory: $(dirname \"$OUTPUT_FILE\")\"\n  mkdir -p \"$(dirname \"$OUTPUT_FILE\")\"\n\n  # Check if .env file exists\n  if [ ! -f \"$ENV_FILE\" ]; then\n      echo \"ERROR: .env file not found at $ENV_FILE\"\n      echo \"Creating empty Secrets.swift\"\n      echo \"// Generated file. Please do not delete, nor edit\" > \"$OUTPUT_FILE\"\n      echo \"\" >> \"$OUTPUT_FILE\"\n      echo \"enum Secrets {\" >> \"$OUTPUT_FILE\"\n      echo \"    static var giphyAPIKey: String { \\\"\\\" }\" >> \"$OUTPUT_FILE\"\n      echo \"}\" >> \"$OUTPUT_FILE\"\n      echo \"Created empty Secrets.swift successfully\"\n      exit 0\n  fi\n\n  echo \"Found .env file, parsing...\"\n\n  # Parse .env file and extract GIPHY_API_KEY\n  GIPHY_API_KEY=\"\"\n  while IFS= read -r line || [ -n \"$line\" ]; do\n      # Skip empty lines and comments\n      if [[ -z \"$line\" || \"$line\" =~ ^[[:space:]]*# ]]; then\n          continue\n      fi\n\n      # Extract GIPHY_API_KEY\n      if [[ \"$line\" =~ ^GIPHY_API_KEY[[:space:]]*=[[:space:]]*(.*) ]]; then\n          GIPHY_API_KEY=\"${BASH_REMATCH[1]}\"\n          # Remove quotes if present\n          GIPHY_API_KEY=\"${GIPHY_API_KEY%\\\"}\"\n          GIPHY_API_KEY=\"${GIPHY_API_KEY#\\\"}\"\n          GIPHY_API_KEY=\"${GIPHY_API_KEY%\\'}\"\n          GIPHY_API_KEY=\"${GIPHY_API_KEY#\\'}\"\n      fi\n  done < \"$ENV_FILE\"\n\n  echo \"Found GIPHY_API_KEY: [REDACTED]\"\n\n  # Generate Secrets.swift using echo commands instead of heredoc\n  echo \"Generating Secrets.swift...\"\n  echo \"// Generated file. Please do not delete, nor edit\" > \"$OUTPUT_FILE\"\n  echo \"\" >> \"$OUTPUT_FILE\"\n  echo \"enum Secrets {\" >> \"$OUTPUT_FILE\"\n  echo \"    static var giphyAPIKey: String { \\\"$GIPHY_API_KEY\\\" }\" >> \"$OUTPUT_FILE\"\n  echo \"}\" >> \"$OUTPUT_FILE\"\n\n  echo \"Generated Secrets.swift successfully\"\n";
